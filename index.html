<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HábitoTracker</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>HábitoTracker</h1>
        <p>Gestor de hábitos y seguimiento diario</p>
    </header>

    <main>
        <h2>Crear un hábito</h2>

        <form id="form-habito">
            <label for="nombre">Nombre del hábito:</label>
            <input type="text" id="nombre" required>

            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion"></textarea>

            <label for="categoria">Categoría:</label>
            <select id="categoria" required>
                <option value="">Selecciona una categoría</option>
                <option value="Salud">Salud</option>
                <option value="Estudio">Estudio</option>
                <option value="Ocio">Ocio</option>
                <option value="Deporte">Deporte</option>
                <option value="Otros">Otros</option>
            </select>

            <button type="submit">Crear hábito</button>
        </form>

        <h2>Mis hábitos</h2>
        <ul id="lista-habitos"></ul>

        <p id="estado">Aplicación preparada.</p>
    </main>
</body>
</html>
